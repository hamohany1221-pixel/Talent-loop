<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Loop — AI Recruitment OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2233; --ink-soft:#4B5170; --paper:#F6F6F3; --paper-raised:#FFFFFF; --line:#E2E2E6;
    --amber:#C6862F; --amber-soft:#F3E4C9; --teal:#2B8A79; --teal-soft:#DBEEEA;
    --coral:#B85C48; --coral-soft:#F2DED7; --muted:#6D7086; --radius-s:4px; --radius-m:10px;
    --sp-1:4px; --sp-2:8px; --sp-3:14px; --sp-4:20px; --sp-5:32px;
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.55;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;font-feature-settings:'ss01';}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:-.2px;}
  button{font-family:inherit;cursor:pointer;}
  a{color:var(--ink);}
  @media (prefers-reduced-motion: no-preference){
    .btn, nav button, .cand-card, .bar-fill, .funnel-fill{transition:background-color .15s ease, border-color .15s ease, opacity .15s ease, width .4s ease;}
  }
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:2px;}

  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  .sidebar{background:var(--ink);color:#E7E8F0;padding:26px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    border-top:3px solid transparent;border-image:linear-gradient(90deg,var(--amber),var(--teal)) 1;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;padding:0 8px;}
  .brand .mark{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--amber);position:relative;}
  .brand .mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--teal);}
  .brand h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.1px;}
  nav{display:flex;flex-direction:column;gap:1px;flex:1;}
  nav button{background:none;border:none;border-left:2px solid transparent;color:#B6B9CC;text-align:left;
    padding:8px 12px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;border-radius:0 3px 3px 0;}
  nav button:hover{background:rgba(255,255,255,.05);color:#fff;}
  nav button.active{background:rgba(255,255,255,.07);color:#fff;border-left-color:var(--amber);font-weight:500;}
  nav button .badge{background:var(--coral);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:10px;}
  .sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:14px;font-size:12px;color:#9B9EB4;}
  .sidebar-foot b{color:#E7E8F0;}

  main{padding:32px 42px 64px;max-width:1180px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:20px;}
  .topline h2{font-size:25px;margin:0 0 4px;font-weight:600;}
  .topline p{margin:0;color:var(--muted);font-size:13.5px;}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .kpi{background:var(--paper-raised);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:var(--radius-m);padding:16px 18px;}
  .kpi .label{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .kpi .value{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;}
  .kpi .sub{font-size:12px;margin-top:6px;}
  .up{color:var(--teal);} .down{color:var(--coral);}

  .panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);padding:22px 24px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .panel-head h3{margin:0;font-size:15.5px;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.2px;border-bottom:1px solid var(--line);padding:0 8px 8px;}
  td{padding:10px 8px;border-bottom:1px solid #EFEFF1;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:#FAFAF8;}

  .pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:500;}
  .pill.new{background:#E9E9EE;color:var(--ink-soft);}
  .pill.contacted{background:var(--amber-soft);color:#82551A;}
  .pill.screening{background:#E1E7F7;color:#2C4A85;}
  .pill.qualified{background:var(--teal-soft);color:#1E6D5E;}
  .pill.interview{background:#EBE0F5;color:#663A8E;}
  .pill.hired{background:var(--teal);color:#fff;}
  .pill.rejected{background:var(--coral-soft);color:#8A3A28;}
  .pill.completed{background:var(--teal-soft);color:#1E6D5E;}
  .pill.scheduled{background:#E1E7F7;color:#2C4A85;}
  .pill.no-show{background:var(--coral-soft);color:#8A3A28;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .dot.g{background:var(--teal);} .dot.y{background:var(--amber);} .dot.r{background:var(--coral);}

  .btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 15px;border-radius:var(--radius-s);font-size:13px;font-weight:500;}
  .btn:hover{background:var(--ink-soft);border-color:var(--ink-soft);}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--paper);border-color:var(--ink-soft);}
  .btn.amber{background:var(--amber);border-color:var(--amber);color:#2E1D02;}
  .btn.amber:hover{background:#B37827;border-color:#B37827;}
  .btn.small{padding:5px 11px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:default;}

  input[type=text],input[type=password],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);font-family:inherit;font-size:13px;background:#fff;color:var(--ink);}
  input:focus,textarea:focus,select:focus{border-color:var(--ink-soft);}
  label{font-size:11.5px;color:var(--muted);display:block;margin:10px 0 5px;font-weight:500;}
  .row{display:flex;gap:10px;} .row>*{flex:1;}

  .cand-card{border:1px solid var(--line);border-radius:var(--radius-m);padding:15px 17px;margin-bottom:10px;background:#fff;}
  .cand-card:hover{border-color:#D2D3DA;}
  .cand-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .cand-card h4{margin:0 0 2px;font-size:14.5px;font-weight:600;}
  .cand-card .meta{color:var(--muted);font-size:12px;}
  .score{font-family:'Fraunces',serif;font-weight:600;font-size:21px;}
  .score.hi{color:var(--teal);} .score.mid{color:var(--amber);} .score.lo{color:var(--coral);}
  .tag{display:inline-block;background:#EFEFF2;border-radius:10px;padding:1.5px 9px;font-size:11px;margin:6px 4px 0 0;color:var(--ink-soft);}
  .why{font-size:12.5px;margin-top:9px;color:var(--ink-soft);line-height:1.5;}
  .why b{color:var(--ink);}

  .copilot{display:grid;grid-template-columns:1fr 300px;gap:18px;height:calc(100vh - 150px);}
  .chatwrap{display:flex;flex-direction:column;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;}
  .chatlog{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:13.5px;}
  .msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:3px;}
  .msg.ai{align-self:flex-start;background:#EFEFF2;color:var(--ink);border-bottom-left-radius:3px;}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
  .chat-input input{flex:1;}
  .suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px;}
  .suggest button{background:#EFEFF2;border:none;border-radius:14px;padding:5px 11px;font-size:12px;color:var(--ink-soft);}
  .suggest button:hover{background:#E4E4EA;}

  .approval-card{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--paper-raised);border-radius:var(--radius-m);padding:13px 15px;margin-bottom:10px;font-size:12.5px;}
  .approval-card .hdr{font-weight:600;margin-bottom:4px;}
  .approval-card .acts{display:flex;gap:8px;margin-top:10px;}
  .empty{color:var(--muted);text-align:center;padding:32px 10px;font-size:13px;}
  .note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .bar-track{background:#EDEDF0;border-radius:6px;height:7px;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;background:var(--teal);}
  .funnel-row{display:grid;grid-template-columns:120px 1fr 50px;gap:10px;align-items:center;margin-bottom:9px;font-size:12.5px;}
  .funnel-bar{background:#EDEDF0;border-radius:4px;height:16px;overflow:hidden;}
  .funnel-fill{height:100%;background:linear-gradient(90deg,var(--ink),var(--amber));}

  .login-shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);}
  .login-brand{background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px;position:relative;overflow:hidden;}
  .login-brand::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--teal));}
  .login-brand .mark-lg{width:44px;height:44px;border-radius:50%;border:3px solid var(--amber);position:relative;margin-bottom:24px;}
  .login-brand .mark-lg::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--teal);}
  .login-brand h1{font-size:32px;margin:0 0 14px;font-weight:600;}
  .login-brand p{color:#B6B9CC;font-size:14.5px;max-width:340px;line-height:1.6;margin:0;}
  .login-form-wrap{display:flex;align-items:center;justify-content:center;padding:40px;}
  .login-card{width:340px;}
  .login-card h2{font-size:20px;margin:0 0 4px;font-weight:600;}
  .login-card p{color:var(--muted);margin:0 0 22px;font-size:13px;}
  .demo-creds{margin-top:18px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;line-height:1.7;}
  .err{color:var(--coral);font-size:12.5px;margin-top:8px;}
  @media (max-width: 860px){
    .login-shell{grid-template-columns:1fr;}
    .login-brand{padding:36px;min-height:220px;}
  }

  .modal-bg{position:fixed;inset:0;background:rgba(30,34,51,.5);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:var(--radius-m);width:420px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;}

  @media (max-width: 900px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:relative;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:14px 16px;}
    .brand{margin-bottom:0;padding:0;}
    nav{flex-direction:row;flex:none;margin-left:20px;}
    .sidebar-foot{display:none;}
    main{padding:16px;}
    .kpis, .grid2, .row{grid-template-columns:1fr;}
    .row{display:flex;flex-direction:column;}
    .copilot{grid-template-columns:1fr;height:auto;}
    .chatwrap{height:60vh;}
    .topline{flex-direction:column;align-items:flex-start;gap:10px;}
    table{font-size:12px;}
    th, td{padding:7px 5px;}
    .modal{width:92vw;}
  }
</style>

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talent Loop">
<meta name="theme-color" content="#1E2233">

</head>
<body>
<div id="root"></div>
<script>
const API = "/api";
let TOKEN = localStorage.getItem("tl_token") || null;
let ME = null;
let route = "dashboard";
let chatMessages = [{role:"ai", text:"Ask me things like \"find German candidates for J1\", \"who needs follow-up\", \"why is the campaign underperforming\", or \"create a campaign for J3\"."}];

async function api(path, opts={}){
  const headers = opts.headers || {};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  if (opts.body) headers["Content-Type"] = "application/json";
  const res = await fetch(API+path, {...opts, headers});
  if (res.status===401){ TOKEN=null; ME=null; localStorage.removeItem("tl_token"); paint(); throw new Error("unauthorized"); }
  return res.json();
}

function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

// ---------- Auth ----------
async function login(username, password){
  const res = await fetch(API+"/auth/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username,password})});
  const data = await res.json();
  if (data.token){
    TOKEN = data.token; ME = data;
    localStorage.setItem("tl_token", TOKEN);
    await loadTeamMembers();
    paint();
  } else {
    document.getElementById("loginErr").textContent = "Invalid username or password.";
  }
}
function logout(){ TOKEN=null; ME=null; localStorage.removeItem("tl_token"); paint(); }

function renderLogin(){
  const root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild(el(`
    <div class="login-shell">
      <div class="login-brand">
        <div class="mark-lg"></div>
        <h1>Talent Loop</h1>
        <p>The operating system for a recruitment call-center team — candidates, campaigns, and the AI copilot that ties them together, all in one place.</p>
      </div>
      <div class="login-form-wrap">
        <div class="login-card">
          <h2>Sign in</h2>
          <p>Access your recruitment workspace.</p>
          <label>Username</label><input type="text" id="loginUser">
          <label>Password</label><input type="password" id="loginPass" onkeydown="if(event.key==='Enter')login(document.getElementById('loginUser').value, document.getElementById('loginPass').value)">
          <button class="btn amber" style="margin-top:16px;width:100%;" onclick="login(document.getElementById('loginUser').value, document.getElementById('loginPass').value)">Sign in</button>
          <div class="err" id="loginErr"></div>
          <div class="demo-creds">admin/admin123 — admin<br>mona/mona123 — team lead<br>recruiter/recruiter123 · sara/sara123 · hassan/hassan123 — recruiters<br>viewer/viewer123 — read-only</div>
        </div>
      </div>
    </div>
  `));
  document.getElementById("loginUser").focus();
}

// ---------- Shell ----------
const NAV = [
  {id:"dashboard", label:"Dashboard"},
  {id:"jobs", label:"Jobs"},
  {id:"candidates", label:"Candidates"},
  {id:"matching", label:"Matching"},
  {id:"campaigns", label:"Campaigns"},
  {id:"pools", label:"Talent Pools"},
  {id:"interviews", label:"Interviews"},
  {id:"offers", label:"Offers"},
  {id:"duplicates", label:"Duplicates"},
  {id:"workflows", label:"Workflows"},
  {id:"intelligence", label:"Intelligence"},
  {id:"team", label:"Team"},
  {id:"queue", label:"Call Queue"},
  {id:"escalations", label:"Escalations"},
  {id:"copilot", label:"AI Copilot"},
  {id:"approvals", label:"Approvals"},
  {id:"admin", label:"Admin"},
];

async function paint(){
  if (!TOKEN){ renderLogin(); return; }
  const root = document.getElementById("root");
  root.innerHTML = `<div class="shell"><aside class="sidebar"><div class="brand"><span class="mark"></span><h1>Talent Loop</h1></div><nav id="nav"></nav><div class="sidebar-foot"><div><b>${ME?ME.username:''}</b> · ${ME?ME.role:''}</div><div style="margin-top:8px;cursor:pointer;text-decoration:underline;" onclick="logout()">Sign out</div></div></aside><main id="main"></main></div>`;
  const nav = document.getElementById("nav");
  const approvals = await api("/approvals").catch(()=>[]);
  const pendingCount = approvals.filter(a=>a.status==="pending").length;
  NAV.forEach(n=>{
    if (n.id === "admin" && !(ME.role==="admin" || ME.role==="team_lead")) return;
    const b = document.createElement("button");
    b.className = n.id===route ? "active":"";
    b.innerHTML = `<span>${n.label}</span>` + (n.id==="approvals"&&pendingCount>0?`<span class="badge">${pendingCount}</span>`:"");
    b.onclick = ()=>{ route=n.id; paint(); };
    nav.appendChild(b);
  });
  const renderers = {dashboard:renderDashboard, jobs:renderJobs, candidates:renderCandidates, matching:renderMatching, campaigns:renderCampaigns, pools:renderPools, interviews:renderInterviews, offers:renderOffers, duplicates:renderDuplicates, workflows:renderWorkflows, intelligence:renderIntelligence, team:renderTeam, queue:renderQueue, escalations:renderEscalations, copilot:renderCopilot, approvals:renderApprovals, admin:renderAdmin};
  renderers[route](document.getElementById("main"));
}

// ---------- Dashboard ----------
async function renderDashboard(main){
  const [campaigns, candidates, sources] = await Promise.all([api("/campaigns"), api("/candidates"), api("/sources")]);
  const camp = campaigns[0];
  const stale = candidates.filter(c=>c.last_contact_days>3 && ["Contacted","Screening"].includes(c.stage));
  main.appendChild(el(`
    <div class="topline"><div><h2>Good morning</h2><p>Here's where things stand across active hiring.</p></div></div>
    <div class="kpis">
      <div class="kpi" style="border-top-color:var(--teal);"><div class="label">Hiring target</div><div class="value">${camp.hires}/${camp.target}</div><div class="sub up">On track</div></div>
      <div class="kpi"><div class="label">Qualified candidates</div><div class="value">${camp.qualified}</div><div class="sub">Across active jobs</div></div>
      <div class="kpi" style="border-top-color:var(--amber);"><div class="label">Interviews this week</div><div class="value">${camp.interviews}</div><div class="sub down">Attendance ${Math.round(camp.attendance_rate*100)}%</div></div>
      <div class="kpi" style="border-top-color:${stale.length>0?'var(--coral)':'var(--teal)'};"><div class="label">Overdue follow-ups</div><div class="value">${stale.length}</div><div class="sub down">Needs attention</div></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <div class="panel-head"><h3>Recruitment funnel — ${camp.name}</h3></div>
        ${camp.funnel.map(s=>`<div class="funnel-row"><div>${s.name}</div><div class="funnel-bar"><div class="funnel-fill" style="width:${Math.min(100, s.value/camp.clicks*100*3)}%"></div></div><div class="mono">${s.value}</div></div>`).join("")}
        <div class="note">Primary bottleneck: <b>${camp.bottleneck.name}</b> — ${(camp.bottleneck.rate*100).toFixed(0)}% conversion from the previous stage, the weakest in the funnel.</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Today's priorities</h3></div>
        <table>
          <tr><td>1</td><td>Follow up with ${stale.length} stale candidates</td></tr>
          <tr><td>2</td><td>Review French B1 sourcing — behind target</td></tr>
          <tr><td>3</td><td>Improve interview attendance (currently ${Math.round(camp.attendance_rate*100)}%)</td></tr>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Source performance</h3></div>
      <table><tr><th>Source</th><th>Applications</th><th>Qualified</th><th>Hires</th><th>Qualified rate</th></tr>
        ${sources.map(s=>`<tr><td>${s.name}</td><td>${s.applications}</td><td>${s.qualified}</td><td>${s.hires}</td><td>${(s.qualified/s.applications*100).toFixed(0)}%</td></tr>`).join("")}
      </table>
    </div>
  `));
}

// ---------- Jobs ----------
async function renderJobs(main){
  const jobs = await api("/jobs");
  main.appendChild(el(`
    <div class="topline"><div><h2>Jobs</h2><p>Manage open roles and job intelligence.</p></div></div>
    <div class="grid2">
      <div class="panel"><div class="panel-head"><h3>Open roles</h3></div>
        <table><tr><th>Role</th><th>Language</th><th>Location</th><th>Filled</th><th>Deadline</th><th>Landing page</th></tr>
        ${jobs.map(j=>`<tr><td>${j.title}</td><td>${j.language} ${j.level}</td><td>${j.location}</td><td>${j.filled}/${j.vacancies}</td><td>${j.deadline}</td><td><a href="/api/landing/${j.id}" target="_blank">View</a></td></tr>`).join("")}
        </table>
      </div>
      <div class="panel"><div class="panel-head"><h3>Import a job (AI extraction)</h3></div>
        <textarea id="jobRaw" rows="6" placeholder="Paste an offer description here..."></textarea>
        <button class="btn amber" style="margin-top:10px;" onclick="handleJobExtract()">Extract with AI</button>
        <div id="jobExtractResult"></div>
        <div class="note">Calls a real endpoint (POST /api/jobs/extract) that runs on the server. No live model is connected in this environment — it applies rule-based parsing and leaves unknown fields blank rather than guessing.</div>
      </div>
    </div>
  `));
}
async function handleJobExtract(){
  const raw = document.getElementById("jobRaw").value;
  const out = document.getElementById("jobExtractResult");
  if (!raw.trim()){ out.innerHTML = `<p class="note">Paste some text first.</p>`; return; }
  const data = await api("/jobs/extract", {method:"POST", body:JSON.stringify({text:raw})});
  out.innerHTML = `<div class="panel" style="margin-top:12px;background:var(--paper);">
    <div class="row"><div><label>Language</label><div>${data.language || "Not detected"}</div></div><div><label>Level</label><div>${data.level || "Not detected"}</div></div></div>
    <div class="row"><div><label>Education</label><div>${data.graduate ? "Graduate" : "Not specified"}</div></div><div><label>Work model</label><div>${data.work_model || "Not specified"}</div></div></div>
    <div><label>Salary</label><div>${data.salary || "Not found in text — will not be invented"}</div></div>

async function openScreening(candidateId){

  window._screenSession = {id:data.session_id, log:data.log, done:data.done};
  paintScreeningModal();
}
function paintScreeningModal(){
  const root = document.getElementById("screeningModalRoot");
  const s = window._screenSession;
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeScreening()"><div class="modal">
    <div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;"><b>AI Screening</b><span style="cursor:pointer;color:var(--muted);" onclick="closeScreening()">✕</span></div>
    <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;">
      ${s.log.map(m=>`<div class="msg ${m.role}" style="align-self:${m.role==='user'?'flex-end':'flex-start'};">${m.text}</div>`).join("")}
    </div>
    ${!s.done ? `<div class="chat-input"><input type="text" id="screenBox" onkeydown="if(event.key==='Enter'){submitScreening(this.value);this.value='';}"><button class="btn small amber" onclick="const i=document.getElementById('screenBox');submitScreening(i.value);i.value='';">Send</button></div>` : `<div style="padding:12px;"><button class="btn small ghost" onclick="closeScreening()">Close</button></div>`}
  </div></div>`;
}
async function submitScreening(text){
  if (!text) return;
  const data = await api(`/screening/${window._screenSession.id}/answer`, {method:"POST", body:JSON.stringify({text})});

  paintScreeningModal();
}

  await api("/calls", {method:"POST", body:JSON.stringify({candidate_id:candidateId, outcome, objection_reason})});
  paint();
}

// ---------- Copilot ----------
function renderCopilot(main){
  main.appendChild(el(`
    <div class="topline"><div><h2>AI Copilot</h2><p>Ask about candidates, jobs, or campaign performance using live system data.</p></div></div>
    <div class="copilot">
      <div class="chatwrap">
        <div class="chatlog" id="chatlog"></div>
        <div class="suggest">
          <button onclick="sendChat('Find German candidates for J1')">Find German candidates for J1</button>
          <button onclick="sendChat('Find candidates we contacted before but never hired')">Never hired but contacted</button>
          <button onclick="sendChat('Match all candidates against J2')">Match all candidates against J2</button>
          <button onclick="sendChat('Create screening questions for J3')">Create screening questions for J3</button>
          <button onclick="sendChat('What should I do today?')">What should I do today?</button>
          <button onclick="sendChat('Why is the campaign underperforming?')">Why is the campaign underperforming?</button>
          <button onclick="sendChat('Create a campaign for J3')">Create a campaign for J3</button>
        </div>
        <div class="chat-input"><input type="text" id="chatBox" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn amber" onclick="sendChat()">Send</button></div>
      </div>
      <div class="panel" style="overflow-y:auto;"><div class="panel-head"><h3>Tool activity</h3></div><div id="toolActivity" class="note">No tool calls yet this session.</div></div>
    </div>
  `));
  paintChat();
}
function paintChat(){
  const log = document.getElementById("chatlog");
  if (!log) return;
  log.innerHTML = chatMessages.map(m=>`<div class="msg ${m.role}">${m.text}</div>`).join("");
  log.scrollTop = log.scrollHeight;
}
async function sendChat(preset){
  const box = document.getElementById("chatBox");
  const text = preset || box.value.trim();
  if (!text) return;
  chatMessages.push({role:"user", text}); box.value=""; paintChat();
  const data = await api("/copilot", {method:"POST", body:JSON.stringify({text})});
  chatMessages.push({role:"ai", text:data.reply}); paintChat();
  const activity = document.getElementById("toolActivity");
  if (activity) activity.innerHTML = data.tool ? `<div class="mono">${data.tool}()</div><div>Ran against the live database via /api/copilot.</div>` : "No tool call needed for that message.";
}

// ---------- Approvals ----------
async function renderApprovals(main){
  const [approvals, audit] = await Promise.all([api("/approvals"), api("/audit")]);
  main.appendChild(el(`
    <div class="topline"><div><h2>Approvals</h2><p>Actions the AI has prepared but not executed.</p></div></div>
    <div class="panel">${approvals.length===0 ? `<div class="empty">Nothing waiting on you right now.</div>` : approvals.map(a=>`
      <div class="approval-card"><div class="hdr">${a.title}</div><div>${a.detail}</div>
        <div class="acts">${a.status==="pending" ? `<button class="btn small" onclick="actOnApproval(${a.id},'approve')">Approve</button><button class="btn small ghost" onclick="actOnApproval(${a.id},'reject')">Reject</button>` : `<span class="pill ${a.status==='approved'?'qualified':'rejected'}">${a.status}</span>`}</div>
      </div>`).join("")}
    </div>
    <div class="panel"><div class="panel-head"><h3>AI action history</h3></div>
      ${audit.length===0 ? `<div class="empty">No actions yet.</div>` : `<table>${audit.map(a=>`<tr><td class="mono">${a.ts}</td><td>${a.actor}</td><td>${a.action}</td><td>${a.detail}</td></tr>`).join("")}</table>`}
    </div>
  `));
}
async function actOnApproval(id, action){
  const res = await api(`/approvals/${id}/${action}`, {method:"POST"});
  if (res.error) { alert(res.error); return; }
  renderApprovals(document.getElementById("main")).catch(()=>{});
  paint();
}

(async function boot(){
  if (TOKEN){
    try { ME = await api("/me"); await loadTeamMembers(); } catch(e){ TOKEN=null; }
  }
  paint();
})();
